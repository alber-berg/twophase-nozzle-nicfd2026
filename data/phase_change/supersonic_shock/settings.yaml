# =============================================================================
# phase_change/supersonic_shock
#
# Single-component flashing water in the SMD converging-diverging nozzle.
# =============================================================================

case:
  id: phase_change/supersonic_shock
  family: single-component flashing (water)
  regime: supersonic_shock

fluid:
  name: water

# --- Equation of state ------------------------------------------------------
# Bicubic tables with metastable properties. N_p_sat is the resolution of the
# saturation line that the mass-transfer closure reads.
eos:
  gas:                          # metastable water vapour
    fluid_name: water
    backend: HEOS
    h_min: 2200000.0            # J/kg
    h_max: 3400000.0            # J/kg
    p_min: 10000.0              # Pa   (0.1 bar)
    p_max: 13000000.0           # Pa   (130 bar)
    N_h: 90
    N_p: 90
    N_p_sat: 150
    table_dir: fluid_tables
    metastable_phase: vapor
    gradient_method: forward
  liquid:                       # metastable water liquid
    fluid_name: water
    backend: HEOS
    h_min: 100000.0             # J/kg
    h_max: 1800000.0            # J/kg
    p_min: 10000.0              # Pa
    p_max: 13000000.0           # Pa
    N_h: 90
    N_p: 90
    N_p_sat: 150
    table_dir: fluid_tables
    metastable_phase: liquid
    gradient_method: forward

# --- Grid and geometry ------------------------------------------------------
grid:
  Nx: 600
  x1: 0.0
  x2: 1.2 # m

geometry:
  function: get_nozzle_smd_divergent_smooth
  roughness: 0.0

# --- Interphase closure -----------------------------------------------------
sources:
  bubble_number: 1.0e11         # 1/m3 - bubbles in the liquid
  droplet_number: 1.0e10        # 1/m3 - droplets in the vapour
  mass_transfer: true           # flashing ON; needs the saturation properties

# --- Boundary conditions ----------------------------------------------------
# A stagnation reservoir drives the inlet: total state, composition and slip are
# imposed. The outlet blends between imposed back-pressure (subsonic) and 
# extrapolation (supersonic) according to the local mixture Mach number.
bc:
  inlet: stagnation
  outlet: characteristic
  p0: 12000000.0                # Pa - 120 bar, shared by both phases
  T_g0: 578.95                  # K
  T_l0: 578.95                  # K
  void_fraction: 1.0e-3         # alpha_g at inlet (the ghost vapour seed)
  slip: 1.0                     # S = u_g / u_l
  dom_phase: auto               # dominant phase chosen by mass fraction
  p_out: 15e5                   # Pa - back-pressure
  p_out_relax: 1.0

# --- Numerics ---------------------------------------------------------------
numerics:
  CFL: 1.0
  newton_iter: 7
  delta_factor: 1e-6            # Harten entropy fix
  recon: muscl_van_albada       # smooth limiter

  k_vm: 0.5                     # virtual mass coefficient
  jacobian: colored
  jac_lag: 1
  linear_solve: normal_eq_banded
  eos_rows: true                # E3-augmented system (removes null-space drift)
  eos_rows_banded: true
  eos_project: false
  nc_form: wb                   # well-balanced non-conservative term: the area
                                # source and the face fluxes are made discretely
                                # consistent, which removes a spurious mode
  nc_scale: 1.0
  lowmach_diss: 1.0             # full acoustic dissipation (the nozzle chokes)
  lowmach_diss_bc: 1.0
  eps_void: 0.05                 # 4th-order JST filter on the void fraction: it
                                # damps the 2 dx mode without changing the
                                # resolved solution
  eps_void_scale: frozen        # filter strength from the single-phase sound
                                # speeds
  eps_void_ucut: null           # ungated: the filter is active everywhere
  eps_void_uwidth: 12.0
  eps_ghost: 0.05               # extra dissipation on the thin ghost phase
  du_blend_lo: 5.0              # m/s - blend to the zero-slip flux branch where
  du_blend_hi: 20.0             # the slip crosses zero and the full branch is
                                # ill-conditioned
  w_char: auto                  # state-derived column scaling
  alpha_eps: 1.0e-6             # void-fraction floor; must match ic.alpha_floor
  pin_ghost: true               # pin the ghost enthalpy to saturation
  pin_ghost_momentum: false

# --- Time-step control ------------------------------------------------------
# Steady state is reached by time marching; dt adapts to bound the per-step
# change in each variable.
time_control:
  adaptive_dt: true
  max_halvings: 8
  dp_max: 0.20
  dh_max: 0.05
  du_max: 0.20
  da_max: 0.10
  dt_grow: 1.20

# --- Initial condition ------------------------------------------------------
ic:
  type: restart
  alpha_floor: 1.0e-6           # ghost seed; matches numerics.alpha_eps

# --- Run control ------------------------------------------------------------
run:
  n_steps: 20000
  print_every: 50
  ssr_tol: 1.0e-8
  t_end: null
  plateau_window: 4000
  plateau_ratio: 1.01
  visualize_ic: false           # runtime switches: they control what the solver
  debug_newton: false           # prints and plots, not what it computes
